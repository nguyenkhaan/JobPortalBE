# V� hi?u h�a gi?i h?n b? ??m POST v� nu?t g�i tin c?a Toymcat
server.tomcat.max-http-form-post-size=2097152
server.tomcat.max-swallow-size=500MB
#Email
app.mail.from=${MAIL_FROM:jobportal@example.com}
spring.mail.host=${SPRING_MAIL_HOST:localhost}
spring.mail.port=${SPRING_MAIL_PORT:1025}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_SMTP_STARTTLS_ENABLE:false}
spring.mail.properties.mail.smtp.starttls.required=${SPRING_MAIL_SMTP_STARTTLS_REQUIRED:false}
spring.mail.properties.mail.smtp.ssl.enable=${SPRING_MAIL_SMTP_SSL_ENABLE:false}
spring.mail.properties.mail.smtp.connectiontimeout=${SPRING_MAIL_CONNECTION_TIMEOUT:5000}
spring.mail.properties.mail.smtp.timeout=${SPRING_MAIL_TIMEOUT:5000}
spring.mail.properties.mail.smtp.writetimeout=${SPRING_MAIL_WRITE_TIMEOUT:5000}

#Payos payment gateway configuration
app.payos.client-id=${PAYOS_CLIENT_ID:thay_ma_client_id_vao_day}
app.payos.api-key=${PAYOS_API_KEY:thay_ma_api_key_vao_day}
app.payos.checksum-key=${PAYOS_CHECKSUM_KEY:thay_ma_checksum_key_vao_day}
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000
